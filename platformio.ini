; Canonical controller firmware (rhythm game, ESP-NOW actuator link, modular src). Flash from this folder only.
; Controller firmware + optional solenoid-node env (same board type, different src set).
[platformio]
default_envs = esp32-s3-devkitc-1

[env]
platform = espressif32
framework = arduino
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = dio
monitor_speed = 115200
; time = timestamps; printable = strip control chars; send_on_enter = line-send; esp32_exception_decoder = decode Guru backtraces
monitor_filters = esp32_exception_decoder, time, default, printable, send_on_enter
upload_speed = 921600
lib_deps =
    adafruit/Adafruit PWM Servo Driver Library@^2.4.0
    https://github.com/duinoWitchery/hd44780.git
    earlephilhower/ESP8266Audio@^1.9.7

[env:esp32-s3-devkitc-1]
board = esp32-s3-devkitc-1
upload_port = COM18
board_build.partitions = partitions_8mb.csv
board_build.filesystem = littlefs
build_src_filter = +<*> -<solenoid_node/>
; T-ETH-Lite S3 SD: add to build_flags below, e.g. -DRHYTHM_SD_CS_PIN=42 -DRHYTHM_SD_SCK_PIN=7 -DRHYTHM_SD_MISO_PIN=5 -DRHYTHM_SD_MOSI_PIN=6
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DRHYTHM_ENABLE_SD=0
    -DPYRRISMA_PIO_ENV=\"esp32-s3-devkitc-1\"

; Actuator node: pio run -e solenoid-node -t upload
; Monitor: pio device monitor -e esp32-s3-devkitc-1  (controller — look for [ESPNOW] tx)
; Monitor: pio device monitor -e solenoid-node        (actuator — look for [ESPNOW] rx)
; ESP-NOW listener -> MCP23017 solenoids + DMX + motor STBY on GPIO13 (alt: -DMOTOR_STBY_PIN=15 or 46; not 4/5=DMX).
; 5V relay (any color hold) on GPIO16, active low. Free alts: 1, 2, 6, 8, 9, 12, 14, 39, 47 (15 = STBY fallback).
; If upload fails, run `pio device list` and set upload_port below or pass --upload-port COMx
[env:solenoid-node]
board = esp32-s3-devkitc-1
upload_port = COM23
; direct = raw serial (no printable/time filters that can hide output)
monitor_filters = esp32_exception_decoder, direct
monitor_dtr = 0
monitor_rts = 0
build_src_filter = +<solenoid_node/> +<espnow_actuator.cpp> +<serial_status.cpp>
lib_deps =
    someweisguy/esp_dmx@^4.1.0
    adafruit/Adafruit MCP23017 arduino library@^2.3.2
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DPYRRISMA_PIO_ENV=\"solenoid-node\"
    -DMOTOR_STBY_PIN=13
    -DRELAY_PIN=16
    -DRELAY_ACTIVE_LOW=0
    -DRELAY_OPEN_DRAIN=0
    ; Boot self-test clicks the relay 3x. Set back to 3 when bringing up hardware.
    -DRELAY_SELFTEST_CYCLES=0
